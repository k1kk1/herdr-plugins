id = "quick-move-3"
title = "Tab 3 へすぐ移動"
contexts = ["pane"]
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-pane-manager" quick-move 3']

[[actions]]
id = "quick-move-4"
title = "Tab 4 へすぐ移動"
contexts = ["pane"]
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-pane-manager" quick-move 4']

[[actions]]
id = "quick-move-5"
title = "Tab 5 へすぐ移動"
contexts = ["pane"]
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-pane-manager" quick-move 5']

[[actions]]
id = "quick-move-6"
title = "Tab 6 へすぐ移動"
contexts = ["pane"]
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-pane-manager" quick-move 6']

[[actions]]
id = "quick-move-7"
title = "Tab 7 へすぐ移動"
contexts = ["pane"]
