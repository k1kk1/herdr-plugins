[[actions]]
id = "quick-move-7"
title = "Quick Move to Tab 7"
contexts = ["pane"]
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-pane-manager" quick-move 7']

[[actions]]
id = "quick-move-8"
