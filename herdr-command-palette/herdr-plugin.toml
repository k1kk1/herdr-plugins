id = "command-palette"
name = "コマンドパレット"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "導入済みプラグインの Action を1つの一覧から検索して実行する"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "palette"
title = "コマンドパレット"
description = "プラグインの Action を検索して実行"
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-command-palette" ui']
placement = "popup"
width = "70%"
height = "70%"

[[actions]]
id = "open"
title = "コマンドパレット"
description = "導入済みプラグインの Action を検索して実行"
contexts = ["global", "pane", "tab"]
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-command-palette" launch']
