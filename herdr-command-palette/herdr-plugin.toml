id = "command-palette"
name = "Command Palette"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Run any installed plugin's action from one searchable list"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "palette"
title = "Command Palette"
description = "Search and run any plugin action"
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-command-palette" ui']
placement = "popup"
width = "70%"
height = "70%"

[[actions]]
id = "open"
title = "Command Palette"
description = "Search and run any installed plugin's action"
contexts = ["global", "pane", "tab"]
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-command-palette" launch']
