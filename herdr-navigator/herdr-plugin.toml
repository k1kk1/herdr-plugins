id = "navigator"
name = "Navigator"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "名前の一部を打って Pane / Tab / Workspace へ移動する"
platforms = ["macos", "linux"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "navigator"
title = "Navigator"
description = "Pane / Tab / Workspace へ移動"
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-navigator" ui']
placement = "popup"
width = "70%"
height = "70%"

[[actions]]
id = "open"
title = "Go to Pane..."
description = "セッション内のすべての Pane から探して移動"
contexts = ["global", "pane"]
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-navigator" launch panes']

[[actions]]
id = "agents"
title = "Go to Agent..."
description = "Agent が動いている Pane から探して移動"
contexts = ["global", "pane"]
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-navigator" launch agents']

[[actions]]
id = "tabs"
title = "Go to Tab..."
description = "セッション内のすべての Tab から探して移動"
contexts = ["global", "tab"]
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-navigator" launch tabs']

[[actions]]
id = "workspaces"
title = "Go to Workspace..."
description = "すべての Workspace から探して移動"
contexts = ["global", "workspace"]
command = ["sh", "-c", 'exec "$HERDR_PLUGIN_ROOT/target/release/herdr-navigator" launch workspaces']
